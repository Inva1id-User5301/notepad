<!doctype html>

<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <img width="400" height="1">
    <br>

    <div id="top">
        <h2 class="inlineWithButton">Add New Note</h2>
        <button id="reveal">Hide</button> 
        <button id="popout">Popout</button>
    </div>

    <div id="new">
        <textarea id="newHeading" rows="1" cols="43" placeholder="Enter new heading"></textarea>
        <button id="clearHead">Clear</button>
        <br>
        <textarea id="newText" rows="5" cols="50" placeholder="Enter new text"></textarea>
        <br>
        <button id="add">Add</button>
        <button id="clearText">Clear</button> 
        <button id="copyNew">Copy</button>
    </div>
    <br>
    
    <div id="mid">
        <h2 class="inlineWithButton" style="padding-bottom: 100px;">Saved Notes</h2>
        <button id="DeleteAll">Delete All</button>
        <button id="SaveAll">Save All</button>
    </div>

    <div id="savedText"></div>

    <script src="script.js"></script>
</body>

</html>
